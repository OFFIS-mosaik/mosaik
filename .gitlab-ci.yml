include:
  - project: mosaik/templates/ci-cd-templates
    file: main-develop.yml
    inputs:
      package: mosaik
      main_branch: master
      develop_branch: develop
      test_pythons: ["3.12", "3.13", "3.14"]

# Execute the pipeline from the mosaik demo project
mosaik demo:
  stage: Tests
  variables:
    UPSTREAM_BRANCH: $CI_COMMIT_REF_NAME # pass the branch name to the downstream pipeline to check out the correct mosaik version
  trigger:
    project: mosaik/examples/mosaik-demo
    branch: master
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true


Docs:
  stage: Tests
  rules:
    - if: "$CI_COMMIT_TAG == null"
  script:
    - cd docs
    - uv run --group=docs sphinx-build -nW . _build/html


Benchmark tests:
  stage: Tests
  rules:
    - if: '$SKIP_BENCHMARKS == "true"'
      when: never
    - if: "$CI_COMMIT_TAG == null"
  script:
    - uv run pytest --benchmarks tests/test_benchmarks.py
